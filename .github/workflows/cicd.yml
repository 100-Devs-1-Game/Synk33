name: Release

env:
  GODOT_VERSION: 4.5.1
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  # Smaller cache size
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

on:
  push:
    tags:
      - "v*"

defaults: 
  run:
    working-directory: ./src

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore and build .NET project
        run: dotnet restore

      - uses: chickensoft-games/setup-godot@v2
        name: Setup Godot
        with:
          # Version must include major, minor, and patch, and be >= 4.0.0
          # Pre-release label is optional.
          version: ${{ env.GODOT_VERSION }} # also valid: 4.0.0.rc1 or 4.0.0 or "global.json", etc
          # Use .NET-enabled version of Godot (the default is also true).
          use-dotnet: true
          # Include the Godot Export Templates (the default is false).
          include-templates: true

      - name: Verify Setup
        run: |
          dotnet --version
          godot --version

      - name: Import Godot Assets
        run: |
          # First pass - import assets only
          godot --headless --import --quit 2>&1 || true
          sleep 2
          # Second pass - run editor mode to complete imports
          timeout 120 godot --headless -e --quit 2>&1 || true
          sleep 2
          # Third pass - ensure all imports are generated
          godot --headless --import --quit 2>&1 || true
        
      - name: Generate .NET Bindings
        run: |
          # Build solutions may fail first time, retry once
          godot --headless --build-solutions --quit 2>&1 || godot --headless --build-solutions --quit 2>&1 || true
  
      - name: Build Projects
        run: dotnet build --configuration Release

      - name: Create export directories
        run: |
          mkdir -p builds/linux
          mkdir -p builds/windows
          mkdir -p builds/archive

      - name: Export Linux Build
        run: godot --headless --export-release "linux_release" builds/linux/SYNK33.x86_64

      - name: Export Windows Build
        run: godot --headless --export-release "windows" builds/windows/SYNK33.exe

      - name: Create Archives
        run: |
          cd builds
          zip -r archive/linux_release.zip linux
          zip -r archive/windows_release.zip windows

      - name: Show build directory
        run: ls -R builds/

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          artifacts: src/builds/archive/*.zip
          allowUpdates: true
  
      - name: Make get_butler.sh executable
        working-directory: .
        run: chmod +x ./get_butler.sh  

      - name: Deploy to itch.io
        working-directory: .
        run: |
          ./get_butler.sh
          BUTLER_API_KEY=${{ secrets.BUTLER_API_KEY }} ./butler --verbose push \
            "./src/builds/linux" \
            "${{ vars.ITCHIO_USERNAME }}/${{ vars.ITCHIO_GAME }}:linux"
          BUTLER_API_KEY=${{ secrets.BUTLER_API_KEY }} ./butler --verbose push \
            "./src/builds/windows" \
            "${{ vars.ITCHIO_USERNAME }}/${{ vars.ITCHIO_GAME }}:windows"

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        uses: Ilshidur/action-discord@master
        with:
          args: '${{ vars.GAME_NAME }} ${{ github.ref_name }} released: https://${{ vars.ITCHIO_USERNAME }}.itch.io/${{ vars.ITCHIO_GAME }} Password: 100devs'
