name: Release

env:
  GODOT_VERSION: 4.5.1
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  # Smaller cache size
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore and build .NET project
        run: |
          cd src
          dotnet restore

      - uses: chickensoft-games/setup-godot@v2
        name: Setup Godot
        working-directory: ./src 
        with:
          # Version must include major, minor, and patch, and be >= 4.0.0
          # Pre-release label is optional.
          version: ${{ env.GODOT_VERSION } # also valid: 4.0.0.rc1 or 4.0.0 or "global.json", etc
          # Use .NET-enabled version of Godot (the default is also true).
          use-dotnet: true
          # Include the Godot Export Templates (the default is false).
          include-templates: true

      - name: Verify Setup
        run: |
          dotnet --version
          godot --version
        
      - name: Generate .NET Bindings
        run: godot --headless --build-solutions --quit || exit 0
  
      - name: Build Projects
        id: build
        run: dotnet build --configuration Release

      - name: Show build directory
        run: ls -R "${{ steps.build.outputs.build_directory }}"

      - name: Show archive directory
        run: ls -R "${{ steps.build.outputs.archive_directory }}"

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          artifacts: ${{ steps.build.outputs.archive_directory }}/**/*.zip
          allowUpdates: true
  
      - name: Make get_butler.sh executable
        run: chmod +x ./get_butler.sh  

      - name: Deploy to itch.io
        run: |
          ./get_butler.sh
          BUTLER_API_KEY=${{ secrets.BUTLER_API_KEY }} ./butler --verbose push \
            "${{ steps.build.outputs.build_directory }}/web_release" \
            "${{ vars.ITCHIO_USERNAME }}/${{ vars.ITCHIO_GAME }}:web"

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        uses: Ilshidur/action-discord@master
        with:
          args: '${{ vars.GAME_NAME }} ${{ github.ref_name }} released: https://${{ vars.ITCHIO_USERNAME }}.itch.io/${{ vars.ITCHIO_GAME }} Password: 100devs'
